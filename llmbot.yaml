name: llmbot
channels:
  - pytorch
  - nvidia
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/pytorch
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1  # 注意：这里改成了 pytorch-cuda
  - pandas
  - matplotlib
  - scikit-learn
  - tqdm
  - pip:
      - --index-url https://pypi.tuna.tsinghua.edu.cn/simple
      - transformers==4.46.3
      - accelerate
      - huggingface-hub
      - wandb
      - pydantic
      - scipy